server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Route 1 : API REST du microservice tourisme
        - id: service-tourisme
          uri: lb://SERVICE-TOURISME
          predicates:
            - Path=/api/destinations/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
